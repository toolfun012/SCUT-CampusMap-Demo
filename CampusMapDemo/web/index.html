<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>校园导航 Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="control-panel">
        <h1>校园导航 Demo</h1>

        <section class="control-group">
          <h2>当前位置</h2>
          <div class="input-row">
            <label>
              X
              <input id="startX" type="number" inputmode="numeric" placeholder="710" />
            </label>
            <label>
              Y
              <input id="startY" type="number" inputmode="numeric" placeholder="2405" />
            </label>
          </div>
          <button id="setStartButton" type="button">确认当前起点</button>
        </section>

        <section class="control-group">
          <h2>目的地</h2>
          <div class="input-row">
            <label>
              X
              <input id="goalX" type="number" inputmode="numeric" placeholder="1710" />
            </label>
            <label>
              Y
              <input id="goalY" type="number" inputmode="numeric" placeholder="2380" />
            </label>
          </div>
          <button id="setGoalPointButton" type="button">确定坐标终点</button>
          <div class="field-divider">或使用预设终点</div>
          <label class="full-field">
            地点
            <input id="destinationInput" list="placeOptions" placeholder="library / 图书馆" />
            <datalist id="placeOptions"></datalist>
          </label>
          <button id="setDestinationButton" type="button">确定地点目的地</button>
        </section>

        <section class="control-group">
          <h2>路线规划</h2>
          <button id="routeButton" type="button">规划路线</button>
        </section>

        <section class="status-card">
          <h2>结果</h2>
          <p id="statusText">正在加载地图数据...</p>
          <dl>
            <div>
              <dt>吸附起点</dt>
              <dd id="startSnapText">-</dd>
            </div>
            <div>
              <dt>吸附终点</dt>
              <dd id="goalSnapText">-</dd>
            </div>
            <div>
              <dt>路线</dt>
              <dd id="routeSummaryText">-</dd>
            </div>
          </dl>
          <button id="resetSelectionButton" class="secondary-button" type="button">清空起终点和路线</button>
        </section>

        <section class="control-group recommendation-card">
          <h2>推荐路线</h2>
          <button id="exitRouteButton" class="exit-button" type="button">最近离开路线</button>
          <dl>
            <div>
              <dt>推荐结果</dt>
              <dd id="recommendationSummaryText">-</dd>
            </div>
            <div>
              <dt>途经点</dt>
              <dd id="recommendationStopsText">-</dd>
            </div>
          </dl>
        </section>
      </aside>

      <section class="map-panel">
        <div class="map-toolbar">
          <span id="hoverPosition">x: -, y: -</span>
          <div class="click-mode">
            <label><input type="radio" name="clickTarget" value="start" checked /> 点击填起点</label>
            <label><input type="radio" name="clickTarget" value="goal" /> 点击填终点</label>
          </div>
          <div class="map-tools">
            <button id="fitMapButton" type="button" title="适配窗口">适配</button>
            <button id="zoomOutButton" type="button" title="缩小">-</button>
            <span id="zoomText">100%</span>
            <button id="zoomInButton" type="button" title="放大">+</button>
            <button id="clearButton" type="button">清空</button>
          </div>
        </div>
        <div class="map-frame" id="mapFrame">
          <div class="map-layer" id="mapLayer">
            <img id="baseMap" alt="华南理工大学大学城校区地图" src="./assets/campus_map.png" />
            <canvas id="routeCanvas"></canvas>
          </div>
          <div class="map-compass" aria-hidden="true">
            <div class="compass-n">N</div>
            <div class="compass-dial">
              <div class="compass-needle north"></div>
              <div class="compass-needle south"></div>
            </div>
            <div class="compass-s">S</div>
          </div>
        </div>
      </section>
    </main>

    <script src="./campus_data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
